<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>ShowMe · WebMCP check</title>
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 44rem; margin: 3rem auto; padding: 0 1rem; color: #172b4d; }
  #status { padding: .8rem 1rem; border-radius: .5rem; font-weight: 600; }
  .ok { background: #dcfce7; color: #14532d; } .bad { background: #fee2e2; color: #7f1d1d; }
  pre { background: #f1f5f9; padding: 1rem; border-radius: .5rem; overflow: auto; white-space: pre-wrap; }
</style>
<h1>WebMCP check</h1>
<div id="status">checking…</div>
<p>Ask your agent to call <code>ping</code>. If it can, site tools work on this origin. <a href="./">Back to Northbank</a> · <a href="meridian/">Meridian</a></p>
<pre id="out"></pre>
<script type="module">
const out = []
const say = s => { out.push(s); document.getElementById('out').textContent = out.join('\n') }
const status = (cls, text) => { const el = document.getElementById('status'); el.className = cls; el.textContent = text }
say('user agent: ' + navigator.userAgent)
say('origin: ' + location.origin + ' · secure context: ' + window.isSecureContext)
let mc = document.modelContext
for (let i = 0; i < 25 && !mc; i++) { await new Promise(r => setTimeout(r, 200)); mc = document.modelContext }
if (!mc) {
  status('bad', 'document.modelContext is missing in this browser on this origin')
  say('navigator.modelContext: ' + (navigator.modelContext ? 'present under the old name' : 'absent'))
} else {
  say('modelContext is ' + (Object.getOwnPropertyDescriptor(document, 'modelContext') ? 'an own property of document (polyfill or injected script)' : 'provided by the browser'))
  await mc.registerTool({
    name: 'ping',
    description: 'Replies pong. Exists only to confirm that agents discover the tools of this page.',
    inputSchema: { type: 'object', properties: {} },
    annotations: { readOnlyHint: true },
    execute: async () => { say(new Date().toLocaleTimeString() + '  ping() was called by an agent'); return 'pong' },
  })
  let names = 'getTools unavailable'
  try { names = (await mc.getTools()).map(t => t.name).join(', ') } catch (e) { names += ': ' + e.message }
  status('ok', 'WebMCP available. Registered tools: ' + names)
}
</script>
</html>
